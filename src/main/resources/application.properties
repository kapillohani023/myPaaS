spring.application.name=mypaas
server.port=8080

# Control-plane database. H2 in PostgreSQL compatibility mode for local operation;
# point spring.datasource.* at PostgreSQL for production. Times are epoch millis.
spring.datasource.url=jdbc:h2:file:./data/mypaas;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=false

spring.thymeleaf.cache=false
spring.web.resources.cache.period=0
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=8h

spring.mail.host=localhost
spring.mail.port=25

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.mail.enabled=false

mypaas.data-dir=./data
mypaas.storage-root=./data/storage
mypaas.keys-dir=./data/keys
mypaas.work-root=./data/apps
mypaas.local-server-root=./data/apps
mypaas.managed-namespace=example.com
mypaas.public-base-url=http://localhost:8080
mypaas.max-concurrent-deployments=3
mypaas.log-buffer-size=5000
mypaas.job-worker-threads=3
mypaas.job-worker-enabled=true
mypaas.max-upload-bytes=52428800
mypaas.notifications-mode=capture
mypaas.mail-from=myPaaS <no-reply@mypaas.local>
mypaas.demo-seed=true

logging.level.io.github.kapillohani023.mypaas=INFO
logging.level.org.springframework.security=WARN
