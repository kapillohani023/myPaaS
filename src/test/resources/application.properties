spring.datasource.url=jdbc:h2:mem:mypaas-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.thymeleaf.cache=false

mypaas.demo-seed=false
mypaas.job-worker-enabled=false
mypaas.job-worker-threads=1
mypaas.keys-dir=./target/test-keys
mypaas.storage-root=./target/test-storage
mypaas.work-root=./target/test-apps
mypaas.managed-namespace=example.com
mypaas.notifications-mode=capture
mypaas.public-base-url=http://localhost:8080
spring.mail.host=localhost

logging.level.io.github.kapillohani023.mypaas=WARN
logging.level.org.springframework=WARN
